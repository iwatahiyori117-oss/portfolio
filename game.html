<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Re: | Game Space</title>
    <script src="https://cdn.jsdelivr.net/npm/pyxel-web@2.0.14/dist/pyxel.js"></script>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: sans-serif; overflow: hidden;
        }
        .back-btn { 
            position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; 
            border: 1px solid #fff; padding: 5px 15px; font-size: 0.8rem; opacity: 0.5; transition: 0.3s;
        }
        .back-btn:hover { opacity: 1; background: #fff; color: #000; }
        
        /* ゲーム画面の大きさを調整 */
        pyxel-run { width: 95vh; aspect-ratio: 4/3; }
    </style>
</head>
<body>

    <a href="po.html" class="back-btn">← BACK TO PORTFOLIO</a>

    <pyxel-run game="game.pyxapp"></pyxel-run>

    <p style="margin-top: 20px; font-size: 0.7rem; color: #444; letter-spacing: 0.1rem;">
        CLICK TO FOCUS / ARROWS: MOVE / SPACE: ACTION
    </p>

</body>
</html>
